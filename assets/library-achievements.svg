<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="228" viewBox="0 0 1000 228" role="img" aria-label="수상 이력: 메타버스 개발자 경진대회 우수상, 한국멀티미디어학회 우수논문상, 메타버스 콘테스트 우수상, 메타버스 에셋 공모전 창의력상"><rect width="1000" height="228" fill="#202124"/><g font-family="Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif"><path d="M40 8H960" stroke="#3a3d42"/><text x="40" y="43" font-size="14" fill="#83baff" font-weight="700">ACHIEVEMENTS</text><text x="40" y="84" font-size="17" fill="#e5e7eb" font-weight="700">우수상</text><text x="173" y="84" font-size="17" fill="#b9bec7" font-weight="400">2023 메타버스 개발자 경진대회</text><text x="40" y="121" font-size="17" fill="#e5e7eb" font-weight="700">우수논문상</text><text x="173" y="121" font-size="17" fill="#b9bec7" font-weight="400">한국멀티미디어학회 2023 춘계학술대회</text><text x="40" y="158" font-size="17" fill="#e5e7eb" font-weight="700">우수상</text><text x="173" y="158" font-size="17" fill="#b9bec7" font-weight="400">제3회 첨단분야 혁신융합대학 메타버스 콘테스트</text><text x="40" y="195" font-size="17" fill="#e5e7eb" font-weight="700">창의력상</text><text x="173" y="195" font-size="17" fill="#b9bec7" font-weight="400">제2회 메타버스 에셋 공모전</text></g></svg>